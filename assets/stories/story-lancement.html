<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Story - Lancement Merch</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'Sao Torpes';
      src: url('../fonts/SaoTorpes.otf') format('opentype');
      font-display: block;
    }
    @font-face {
      font-family: 'Eskool';
      src: url('../fonts/Eskool-Regular.ttf') format('truetype');
      font-display: block;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1080px; height: 1920px; overflow: hidden; background: #1a4a46; }
    .story {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }
    .story__photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 35%;
    }
    .story__shade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(26,74,70,0.15) 0%, rgba(26,74,70,0.05) 40%, rgba(26,74,70,0.85) 100%);
    }
    .story__content {
      position: absolute;
      left: 72px;
      right: 72px;
      bottom: 120px;
      z-index: 2;
      color: #fff;
    }
    .label {
      font-family: 'Sora', sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.72);
      margin-bottom: 28px;
    }
    .title {
      font-family: 'Sao Torpes', 'Sora', sans-serif;
      font-size: 78px;
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1.02;
      max-width: 14ch;
    }
    .brand {
      margin-top: 36px;
      font-family: 'Sora', sans-serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.55;
    }
  </style>
</head>
<body>
  <div class="story">
    <img
      class="story__photo"
      src="photo-088-2025.jpg"
      alt=""
    />
    <div class="story__shade"></div>
    <div class="story__content">
      <p class="label">Oyster House 2026</p>
      <h1 class="title">Vous nous l’avez demandé, cette année on lance le merch.</h1>
      <p class="brand">oysterhouse.fr/merch</p>
    </div>
  </div>
</body>
</html>
