<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Story - Tee Shirt Mocha</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'Sao Torpes';
      src: url('../fonts/SaoTorpes.otf') format('opentype');
      font-display: block;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1080px; height: 1920px; overflow: hidden; background: #1f5652; }
    .story {
      width: 1080px;
      height: 1920px;
      padding: 48px 0 0;
      background: #1f5652;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .title {
      font-family: 'Sao Torpes', 'Sora', sans-serif;
      font-size: 72px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 0.95;
      text-align: center;
      text-transform: uppercase;
      margin-bottom: 8px;
      padding: 0 40px;
      flex: 0 0 auto;
    }
    .visual {
      width: 1080px;
      height: 1480px;
      flex: 0 0 1480px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .visual img {
      height: 1480px;
      width: auto;
      max-width: none;
      filter: drop-shadow(0 36px 50px rgba(0,0,0,0.4));
    }
    .link-zone {
      margin-top: auto;
      width: 100%;
      height: 140px;
      flex: 0 0 140px;
    }
  </style>
</head>
<body>
  <div class="story">
    <h1 class="title">Tee Shirt<br>Mocha</h1>
    <div class="visual">
      <img src="tee-front-story.png" alt="Tee Shirt Mocha" />
    </div>
    <div class="link-zone" aria-hidden="true"></div>
  </div>
</body>
</html>
